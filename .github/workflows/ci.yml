name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the wheel (pybind11 extension via scikit-build-core) and run the
  # Python test suite against the pip-installed package on Linux and macOS.
  python:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # macOS is kept to one interpreter (3.12). drake's macOS-arm64 wheels
          # lag its Linux ones (no macOS drake >= 1.33 exists for 3.10), so 3.10
          # and 3.11 are exercised on Linux only.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libomp-dev

      - name: Install system build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen libomp

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with test extras)
        run: |
          python -m pip install --upgrade pip
          # pybmtp pins scsplanning to a git commit (not on PyPI); pip resolves
          # that direct reference from pyproject during the editable install.
          pip install -e '.[test]'

      - name: Run Python tests
        run: pytest -q

  # Smoke-test the examples end to end (headless) against the installed package.
  examples:
    name: examples smoke test on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libomp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # matplotlib is an examples-only dependency (figure rendering).
          pip install . matplotlib

      - name: Run examples (both planners, headless)
        run: |
          python examples/box_obstacles_2d.py
          python examples/dual_arm_unload.py --planner bmtp --no-meshcat
          python examples/dual_arm_unload.py --planner scs --no-meshcat

  # Build and run the native gtest target (Bezier collision kernel) on Linux.
  native:
    name: native gtest on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libomp-dev

      - name: Configure
        run: cmake -S . -B build-cpp -DPYBMTP_BUILD_TESTS=ON -DPYBMTP_BUILD_PYTHON=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cpp --parallel

      - name: Test
        run: ctest --test-dir build-cpp --output-on-failure
