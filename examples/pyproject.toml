[project]
name = "pybmt-examples"
version = "0"
description = "Runnable examples for pybmt."
requires-python = ">=3.10"
dependencies = ["pybmt", "matplotlib", "meshcat"]

# A single uv project shared by every script in this directory: `uv run`
# resolves pybmt from the parent checkout (editable) plus matplotlib, so the
# examples need no per-file dependency metadata.
[tool.uv.sources]
pybmt = { path = "..", editable = true }
