[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pybmt"
version = "0.1.0"
description = "Biconvex minimum-time trajectory planning with Bezier curves."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Peter Werner", email = "wernrpe@gmail.com" }]
keywords = ["trajectory optimization", "motion planning", "bezier", "minimum time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]

# Hard dependencies. drake provides the `pydrake` symbolic + optimization stack;
# pybezier lets us build Bezier curves over Drake decision variables (symbolic
# round-tripping); scsplanning supplies the SCS variant's exact-separation core.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    # 1.33.0 is the last drake wheel built for macOS 13; pybmt's only newer-API
    # use was solvers.SolveInParallel, which now falls back to a serial solve
    # (see pybmt/_solve.py) so this floor stays installable on macOS 13 (arm64).
    "drake>=1.33; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # drake stopped publishing macOS x86_64 (Intel Mac) wheels after 1.34.0, and
    # there is no sdist, so cap Intel-macOS resolution at the last wheel.
    "drake>=1.33,<=1.34; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pybezier>=0.1.4",
    # scsplanning is not published to PyPI; pin it to a specific commit of the
    # upstream repo. (A direct URL means the project can't be uploaded to PyPI
    # as-is, but it makes `pip install` of pybmt reproducible from source.)
    "scsplanning @ git+https://github.com/TobiaMarcucci/scsplanning.git@d3f885aa2b74a10418de96e61ec2df0bf6ef16b8",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wernerpe/pybmt"
Repository = "https://github.com/wernerpe/pybmt"

# ---------------------------------------------------------------------------
# scikit-build-core: drives the CMake build of the pybind11 extension.
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/pybmt"]
# Only the Python extension is built for a wheel; the gtest target stays off.
cmake.args = ["-DPYBMT_BUILD_PYTHON=ON", "-DPYBMT_BUILD_TESTS=OFF"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# numpy emits RuntimeWarnings when it evaluates object-dtype arrays of Drake
# symbolic expressions (the readable symbolic constraint path). They are
# harmless; silence them so real warnings stand out.
filterwarnings = [
    "ignore:invalid value encountered:RuntimeWarning",
]
